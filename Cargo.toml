[package]
name = "wgpu_learn"
version = "0.1.0"
edition = "2024"
description = "wgpu 学习示例：从窗口/清屏到纹理/深度/相机的小项目"
default-run = "wgpu_learn"

[dependencies]
# 核心依赖（锁定版本，与 README 保持一致）
wgpu = "=30.0.1"
winit = "=0.30.13"
glam = "=0.34.1"
pollster = "=1.0.1"
env_logger = "=0.11.11"
anyhow = "=1"
thiserror = "=2"
# # 支撑依赖
log = "0.4"
# bytemuck = { version = "1", features = ["derive"] }

# 每个练习作为独立二进制目标，可用 `cargo run --bin <name>` 运行
[[bin]]
name = "setup1"
path = "exercises/00_setup/0-1-setup1.rs"

[[bin]]
name = "setup2"
path = "exercises/00_setup/0-2-setup2.rs"

[[bin]]
name = "clear1"
path = "exercises/01_clear/1-1-clear1.rs"

[[bin]]
name = "clear2"
path = "exercises/01_clear/1-2-clear2.rs"

[[bin]]
name = "clear3"
path = "exercises/01_clear/1-3-clear3.rs"

[[bin]]
name = "build_render_loop"
path = "exercises/01_clear/1-4-build_render_loop.rs"

[[bin]]
name = "shader1"
path = "exercises/02_triangle/2-1-shader1.rs"

[[bin]]
name = "pipeline1"
path = "exercises/02_triangle/2-2-pipeline1.rs"

[[bin]]
name = "build_pipeline_manager"
path = "exercises/02_triangle/2-3-build_pipeline_manager.rs"

[[bin]]
name = "view_matrix"
path = "exercises/03_camera/3-1-view_matrix.rs"

[[bin]]
name = "mvp"
path = "exercises/03_camera/3-2-mvp.rs"

[[bin]]
name = "uniform1"
path = "exercises/03_camera/3-3-uniform1.rs"

[[bin]]
name = "build_bind_group"
path = "exercises/03_camera/3-4-build_bind_group.rs"

[[bin]]
name = "depth_linear"
path = "exercises/04_texture_depth/4-1-depth_linear.rs"

[[bin]]
name = "texture1"
path = "exercises/04_texture_depth/4-2-texture1.rs"

[[bin]]
name = "depth1"
path = "exercises/04_texture_depth/4-3-depth1.rs"

[[bin]]
name = "build_asset_store"
path = "exercises/04_texture_depth/4-4-build_asset_store.rs"

[[bin]]
name = "project1"
path = "exercises/05_project/5-1-project1.rs"

[[bin]]
name = "build_ecs_world"
path = "exercises/05_project/5-2-build_ecs_world.rs"

[[bin]]
name = "postprocess1"
path = "exercises/06_extend/6-1-postprocess1.rs"

[[bin]]
name = "blend1"
path = "exercises/06_extend/6-2-blend1.rs"

[[bin]]
name = "shadow1"
path = "exercises/06_extend/6-3-shadow1.rs"

[[bin]]
name = "compute1"
path = "exercises/06_extend/6-4-compute1.rs"

[[bin]]
name = "build_render_graph"
path = "exercises/06_extend/6-5-build_render_graph.rs"

[[bin]]
name = "brdf_diffuse"
path = "exercises/07_math/7-1-brdf_diffuse.rs"

[[bin]]
name = "brdf_ggx"
path = "exercises/07_math/7-2-brdf_ggx.rs"

[[bin]]
name = "fresnel"
path = "exercises/07_math/7-3-fresnel.rs"

[[bin]]
name = "importance_sample"
path = "exercises/07_math/7-4-importance_sample.rs"

[[bin]]
name = "input1"
path = "exercises/08_input/8-1-input1.rs"

# 依赖用优化模式编译，降低 wgpu 调试运行时的 shader/校验开销
[profile.dev.package."*"]
opt-level = 2
